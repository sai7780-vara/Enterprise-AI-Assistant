apiVersion: v1
kind: Secret
metadata:
  name: ai-assistant-secret
  namespace: default
type: Opaque
data:
  # Base64 encoded value for "your_gemini_api_key_here" (eW91cl9nZW1pbmlfYXBpX2tleV9oZXJl)
  # To use: replace this with your actual Gemini API key encoded in base64.
  # Generate on Linux/macOS: echo -n "YOUR_API_KEY" | base64
  # Generate on Windows PowerShell: [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("YOUR_API_KEY"))
  GEMINI_API_KEY: eW91cl9nZW1pbmlfYXBpX2tleV9oZXJl
